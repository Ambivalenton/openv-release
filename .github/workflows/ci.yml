# SPDX-License-Identifier: GPL-3.0-or-later
# Prüft jeden Push und Pull Request: Quellen und generierte Dateien, alle Tests, Lint und die
# Test-App „Öpen-V · Vorschau“ (dev.ambivalenton.openv.next, ARM64). Auf main erscheint die
# Vorschau im Release „vorschau“, das bei jedem Lauf ersetzt wird.
name: CI

on:
  push:
    branches: [main, vorschau/1.2.0.7]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
    env:
      # Endpoint of an individually granted timetable access (docs/timetable-services.md); unused for VRR.
      OPENV_TIMETABLE_ENDPOINT: ${{ secrets.OPENV_TIMETABLE_ENDPOINT }}
      HAS_PREVIEW_KEY: ${{ secrets.OPENV_REVIEW_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK 36 bereitstellen
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Quellen und generierte Dateien prüfen
        run: python3 tools/check_release.py

      - name: Tests
        run: ./gradlew --no-daemon --console=plain :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon --console=plain :app:lintDebug

      - name: Testschlüssel wiederherstellen
        if: env.HAS_PREVIEW_KEY == 'true'
        env:
          KEY_B64: ${{ secrets.OPENV_REVIEW_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEY_B64" | base64 --decode --ignore-garbage > "$RUNNER_TEMP/preview.keystore"
          echo "OPENV_REVIEW_KEYSTORE=$RUNNER_TEMP/preview.keystore" >> "$GITHUB_ENV"

      - name: Vorschau-APK bauen
        run: ./gradlew --no-daemon --console=plain :app:assemblePreview -PapkSplits=true -PapkAbis=arm64-v8a

      - name: APK prüfen und benennen
        id: apk
        run: |
          apk=$(find app/build/outputs/apk/preview -name '*.apk' | head -n1)
          test -n "$apk"
          code=$(grep -oE 'versionCode = [0-9]+' app/build.gradle.kts | grep -oE '[0-9]+')
          version=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | cut -d'"' -f2)
          python3 tools/verify_apk.py --apk "$apk" --package dev.ambivalenton.openv.next --version-code "$code" \
            --abi arm64-v8a --report-cert --json "$RUNNER_TEMP/apk-check.json"
          if [ "$HAS_PREVIEW_KEY" = "true" ]; then suffix=""; else suffix="_einmalig"; fi
          name="OpenV-Vorschau_${version}_b${code}_${GITHUB_SHA::7}${suffix}.apk"
          mkdir -p "$RUNNER_TEMP/out"
          cp "$apk" "$RUNNER_TEMP/out/$name"
          echo "file=$RUNNER_TEMP/out/$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: oepenv-vorschau
          path: ${{ steps.apk.outputs.file }}
          retention-days: 14

      # Public release notes: what changed in this version (the store changelog of its versionCode,
      # one line per change) and how the preview installs; German first, English folded below.
      - name: Release „vorschau“ aktualisieren
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/vorschau/1.2.0.7')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.apk.outputs.version }}
          CODE: ${{ steps.apk.outputs.code }}
        run: |
          if [ "$GITHUB_REF_NAME" = 'vorschau/1.2.0.7' ]; then
            test "$VERSION" = '1.2.0.7' && test "$CODE" = '127' || exit 1
            test "$HAS_PREVIEW_KEY" = 'true'
            # A newer preview may have shipped while this branch was being tested.
            previous=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/vorschau" --jq '.object.sha')
            test "$previous" = 'eb327a9605cfa0194c80847b0a623436a191ba53' || test "$previous" = "$GITHUB_SHA"
          fi
          changes() { sed -e 's/^[•*-] */- /' -e '/^[[:space:]]*$/d' "fastlane/metadata/android/$1/changelogs/$CODE.txt"; }
          if [ "$HAS_PREVIEW_KEY" = "true" ]; then
            install_de="Spätere Vorschauversionen lassen sich als Update darüber installieren."
            install_en="Later preview builds install as an update."
          else
            install_de="Dieser Build ist einmalig signiert; eine zuvor installierte Vorschau muss vorher entfernt werden."
            install_en="This build has a one-off signature; remove an earlier preview before installing it."
          fi
          notes="$RUNNER_TEMP/notes.md"
          {
            echo "Vorabversion von Öpen-V $VERSION zum Testen vor der nächsten regulären Veröffentlichung."
            echo
            echo "### Änderungen"
            changes de-DE
            echo
            echo "### Installation"
            echo "Die Vorschau wird als eigene App „Öpen-V · Vorschau“ neben der regulären Version installiert. $install_de"
            echo
            echo "<details><summary>English</summary>"
            echo
            echo "Preview build of Öpen-V $VERSION for testing ahead of the next regular release."
            echo
            echo "**Changes**"
            echo
            changes en-US
            echo
            echo "**Installation:** installs as a separate app, “Öpen-V · Vorschau”, alongside the regular version. $install_en"
            echo
            echo "</details>"
            echo
            echo "Build $CODE · [${GITHUB_SHA::7}](https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA) · [Alle Änderungen](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/CHANGELOG.md)"
          } > "$notes"
          gh release delete vorschau --yes --cleanup-tag 2>/dev/null || true
          gh release create vorschau "${{ steps.apk.outputs.file }}" --prerelease --target "$GITHUB_SHA" \
            --title "Öpen-V · Vorschau $VERSION (Build $CODE)" --notes-file "$notes"

      - name: Testberichte bei Fehler sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testberichte
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          retention-days: 7
          if-no-files-found: ignore
